# ─────────────────────────────────────────────────────────────────────────────
#  Render Blueprint — Integrated BI / SOTIFibre Platform
#  Doc : https://render.com/docs/blueprint-spec
#
#  Déployer :
#  1) Pousser ce fichier sur GitHub
#  2) https://dashboard.render.com/blueprints → "New Blueprint Instance"
#  3) Connecter le repo, Render lit ce fichier et crée tout automatiquement
# ─────────────────────────────────────────────────────────────────────────────

databases:
  - name: sotifibre-db
    databaseName: sotifibre
    user: sotifibre
    plan: free            # Passe à "starter" en payant pour des perfs réelles
    region: frankfurt     # Plus proche de la Tunisie (latence ↓)

services:
  # ───── Backend Django ──────────────────────────────────────────────────────
  - type: web
    name: sotifibre-backend
    runtime: python
    plan: free
    region: frankfurt
    rootDir: sotifibre_backend_django
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    healthCheckPath: /api/health/
    autoDeploy: true

    envVars:
      # ─── Sécurité / Django ────────────────────────────────────────────────
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true       # Render génère une clé aléatoire
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"    # Couvre tous les sous-domaines Render

      # ─── Base de données : injection automatique ──────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: sotifibre-db
          property: connectionString

      # ─── CORS / CSRF : à adapter quand le frontend est déployé ────────────
      - key: CORS_ALLOWED_ORIGINS
        value: "https://sotifibre-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://sotifibre-frontend.onrender.com,https://*.onrender.com"
      - key: FRONTEND_URL
        value: "https://sotifibre-frontend.onrender.com"
      - key: BACKEND_URL
        sync: false               # À renseigner manuellement après le 1er deploy

      # ─── JWT lifetimes ────────────────────────────────────────────────────
      - key: ACCESS_TOKEN_LIFETIME_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"

      # ─── Email (optionnel — laisse vide si non utilisé) ───────────────────
      - key: SENDGRID_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "noreply@sotifibre.com"

      # ─── Twilio / Slack / Grok (optionnel) ────────────────────────────────
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: GROK_API_KEY
        sync: false

  # ───── Frontend Vue 3 (optionnel — décommente si tu veux déployer ici aussi) ─
